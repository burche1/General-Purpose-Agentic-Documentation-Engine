[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-agent"
version = "0.2.0"
description = "Local-first context-driven document planning, ingestion and retrieval"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[tool.setuptools]
packages = ["engine"]
